name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh shellcheck
          pip install ruff pytest
      - name: ruff
        run: ruff check .
      - name: shellcheck (bash)
        run: shellcheck -s bash notes/run_uzu_9b.sh
      - name: zsh syntax
        run: for f in run-ai.command run-kaggle-chat.command run-llama-server.command run-uzu-server.command lib/launcher-common.zsh; do zsh -n "$f"; done
      - name: pytest (runtime / kbuild / step2 / exl3 / notebooks)
        run: python3 -m pytest tests -q
      - name: generate exl3 outputs
        run: python3 kaggle/build_exl3_serve.py
      - name: generate engine outputs (lmdeploy / sglang)
        run: python3 kaggle/build_engine_serve.py
      - name: ruff (generated outputs)
        run: ruff check --no-respect-gitignore kaggle/exl3-serve-kernel kaggle/lmdeploy-serve kaggle/sglang-serve
      - name: compile generated outputs
        run: python3 -m compileall -q kaggle/exl3-serve-kernel kaggle/lmdeploy-serve kaggle/sglang-serve kaggle/ci-cpu
